<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Bot Trading v5.0</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --bg: #0f0f1a; --card: #1a1a2e; --green: #00ff88; --red: #ff4757; --gold: #ffa502; --text: #ffffff; --subtext: #aaaacc; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; min-height: 100vh; padding: 15px; }
        .header { text-align: center; padding: 20px 0; }
        .header h1 { font-size: 22px; margin: 10px 0; }
        .status { display: inline-block; background: rgba(0,255,136,0.15); color: var(--green); padding: 5px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .pulse { animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .nav-tabs { display: flex; gap: 8px; margin: 15px 0; overflow-x: auto; padding-bottom: 5px; }
        .nav-tab { padding: 10px 18px; border-radius: 10px; border: none; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; background: rgba(255,255,255,0.05); color: var(--subtext); }
        .nav-tab.active { background: linear-gradient(135deg, #00ff88, #00b4d8); color: #0f0f1a; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .card { background: var(--card); border-radius: 16px; padding: 18px; margin-bottom: 14px; border: 1px solid rgba(255,255,255,0.06); }
        .card-title { font-size: 16px; font-weight: 700; margin-bottom: 12px; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .stat-item { background: rgba(255,255,255,0.03); border-radius: 12px; padding: 14px; text-align: center; }
        .stat-value { font-size: 26px; font-weight: 700; color: var(--green); }
        .stat-label { font-size: 10px; color: var(--subtext); text-transform: uppercase; margin-top: 4px; }
        .signal-card { background: linear-gradient(135deg, rgba(0,255,136,0.08), rgba(0,180,216,0.08)); border: 1px solid rgba(0,255,136,0.25); }
        .badge { display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 700; }
        .badge-call { background: rgba(0,255,136,0.2); color: #00ff88; }
        .badge-put { background: rgba(255,71,87,0.2); color: #ff4757; }
        .signal-row { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,0.04); font-size: 13px; }
        .signal-row:last-child { border-bottom: none; }
        .btn { display: block; width: 100%; padding: 14px; border: none; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; text-align: center; margin: 8px 0; transition: all 0.2s; color: inherit; text-decoration: none; }
        .btn:active { transform: scale(0.97); }
        .btn-green { background: linear-gradient(135deg, #00ff88, #00b4d8); color: #0f0f1a; }
        .btn-gold { background: linear-gradient(135deg, #ffa502, #ff6348); color: #fff; }
        .btn-outline { background: rgba(255,255,255,0.06); color: var(--text); border: 1px solid rgba(255,255,255,0.15); }
        .btn-danger { background: linear-gradient(135deg, #ff4757, #c0392b); color: #fff; }
        .iframe-container { position: relative; width: 100%; height: 75vh; border-radius: 12px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); }
        .iframe-container iframe { width: 100%; height: 100%; border: none; }
        .forex-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .forex-item { background: rgba(255,255,255,0.03); border-radius: 10px; padding: 12px; cursor: pointer; }
        .forex-pair { font-weight: 700; font-size: 13px; }
        .forex-price { font-size: 16px; font-weight: 700; margin: 4px 0; }
        .price-up { color: #00ff88; }
        .price-down { color: #ff4757; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🤖 Bot Trading v5.0</h1>
        <span class="status pulse">● EN LÍNEA</span>
    </div>
    <div class="nav-tabs">
        <button class="nav-tab active" onclick="showTab('inicio')">🏠 Inicio</button>
        <button class="nav-tab" onclick="showTab('forex')">📊 Forex</button>
        <button class="nav-tab" onclick="showTab('crypto')">₿ Crypto</button>
        <button class="nav-tab" onclick="showTab('quotex')">💹 Quotex</button>
        <button class="nav-tab" onclick="showTab('senales')">🎯 Señales</button>
    </div>

    <div id="tab-inicio" class="tab-content active">
        <div class="card"><div class="card-title">📊 Resumen</div>
            <div class="stats-grid">
                <div class="stat-item"><div class="stat-value">3</div><div class="stat-label">Forex Hoy</div></div>
                <div class="stat-item"><div class="stat-value">3</div><div class="stat-label">Crypto Hoy</div></div>
                <div class="stat-item"><div class="stat-value">95%</div><div class="stat-label">Efectividad</div></div>
                <div class="stat-item"><div class="stat-value">5m</div><div class="stat-label">Próximo</div></div>
            </div>
        </div>
        <button class="btn btn-green" onclick="showTab('senales')">🎯 Ver Señales</button>
        <button class="btn btn-gold" onclick="abrirQuotex()">💹 Quotex Broker</button>
        <button class="btn btn-outline" onclick="window.Telegram.WebApp.close()">📱 Cerrar</button>
    </div>

    <div id="tab-forex" class="tab-content">
        <div class="card"><div class="card-title">📊 Forex Tiempo Real</div><div class="forex-grid" id="forex-prices">Cargando...</div></div>
        <button class="btn btn-gold" onclick="abrirQuotex()">💹 Operar en Quotex</button>
    </div>

    <div id="tab-crypto" class="tab-content">
        <div class="card"><div class="card-title">₿ Crypto Binance</div><div id="crypto-prices">Cargando...</div></div>
    </div>

    <div id="tab-quotex" class="tab-content">
        <div class="card"><div class="card-title">💹 Quotex - Plataforma Oficial</div></div>
        <div class="iframe-container"><iframe id="quotex-iframe" src="https://broker-qx.pro/sign-up/?lid=2097658" allow="camera;microphone;payment" sandbox="allow-same-origin allow-scripts allow-popups allow-forms allow-modals"></iframe></div>
        <button class="btn btn-green" onclick="window.open('https://broker-qx.pro/sign-up/?lid=2097658', '_blank')">🔗 Abrir en navegador</button>
        <button class="btn btn-outline" onclick="document.getElementById('quotex-iframe').src='https://broker-qx.pro/sign-up/?lid=2097658'">🔄 Recargar</button>
    </div>

    <div id="tab-senales" class="tab-content">
        <div class="card signal-card"><div class="card-title">🎯 Señal Forex</div>
            <div id="senal-forex">
                <div class="signal-row"><span>📊 Par:</span><span><strong>EUR/USD</strong></span></div>
                <div class="signal-row"><span>⏰ Entrada:</span><span><strong id="hora-entrada">--:--</strong></span></div>
                <div class="signal-row"><span>🎯 Dirección:</span><span><strong id="direccion">--</strong></span></div>
                <div class="signal-row"><span>⏳ Vencimiento:</span><span><strong id="vencimiento">--:--</strong></span></div>
                <div class="signal-row"><span>📈 Gale 1:</span><span><strong id="gale1">--:--</strong></span></div>
                <div class="signal-row"><span>📈 Gale 2:</span><span><strong id="gale2">--:--</strong></span></div>
            </div>
        </div>
        <button class="btn btn-green" onclick="generarSenal()">🔄 Nueva Señal</button>
        <button class="btn btn-gold" onclick="abrirQuotex()">💹 Operar en Quotex</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); tg.ready();

        function abrirQuotex() {
            window.open('https://broker-qx.pro/sign-up/?lid=2097658', '_blank');
        }

        function showTab(tab) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            document.getElementById('tab-' + tab).classList.add('active');
            event.target.classList.add('active');
            if (tab === 'forex') cargarForex();
            if (tab === 'crypto') cargarCrypto();
        }

        function generarSenal() {
            const ahora = new Date();
            const min = Math.ceil(ahora.getMinutes() / 5) * 5;
            const entrada = new Date(ahora); entrada.setMinutes(min, 0, 0);
            const vence = new Date(entrada.getTime() + 300000);
            const g1 = new Date(vence.getTime() + 300000);
            const g2 = new Date(g1.getTime() + 300000);
            const f = d => d.toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit'});
            const dir = Math.random() > 0.5 ? 'CALL 🟩' : 'PUT 🟥';
            document.getElementById('hora-entrada').textContent = f(entrada);
            document.getElementById('direccion').textContent = dir;
            document.getElementById('vencimiento').textContent = f(vence);
            document.getElementById('gale1').textContent = f(g1);
            document.getElementById('gale2').textContent = f(g2);
            tg.HapticFeedback.notification('success');
        }

        async function cargarForex() {
            try {
                const r = await fetch('https://api.exchangerate-api.com/v4/latest/USD');
                const d = await r.json();
                const pares = [['EUR/USD','EUR'],['GBP/USD','GBP'],['USD/JPY','JPY'],['AUD/USD','AUD']];
                let h = '';
                pares.forEach(([p, q]) => {
                    const precio = p.startsWith('USD') ? d.rates[q] : d.rates[q] / d.rates[p.split('/')[0]];
                    h += `<div class="forex-item" onclick="abrirQuotex()"><div class="forex-pair">${p}</div><div class="forex-price">${precio.toFixed(5)}</div></div>`;
                });
                document.getElementById('forex-prices').innerHTML = h;
            } catch(e) { document.getElementById('forex-prices').innerHTML = 'Error'; }
        }

        async function cargarCrypto() {
            try {
                const syms = ['BTCUSDT','ETHUSDT','BNBUSDT','SOLUSDT'];
                const proms = syms.map(s => fetch(`https://api.binance.com/api/v3/ticker/price?symbol=${s}`).then(r => r.json()));
                const res = await Promise.all(proms);
                let h = '';
                res.forEach(r => { h += `<div class="card"><strong>${r.symbol.replace('USDT','')}</strong>: $${parseFloat(r.price).toFixed(2)}</div>`; });
                document.getElementById('crypto-prices').innerHTML = h;
            } catch(e) { document.getElementById('crypto-prices').innerHTML = 'Error'; }
        }

        generarSenal();
    </script>
</body>
</html>
