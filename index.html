cat > index.html << 'EOF'
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Angel Trader Robot</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            min-height: 100vh;
            background: #0a0a0a url('https://Cryptoshelby.github.io/Mini-app-bot/fondo.jpeg') center/cover no-repeat fixed;
            color: #ffffff;
            padding: 15px;
        }
        .overlay { background: rgba(0,0,0,0.7); border-radius: 20px; padding: 15px; min-height: 100vh; }
        .header { text-align: center; padding: 15px 0; }
        .header h1 { font-size: 24px; font-weight: 800; color: #00ff88; }
        .header .subtitle { font-size: 10px; color: #ffa502; letter-spacing: 2px; font-weight: 700; }
        .status { display: inline-block; background: rgba(0,255,136,0.2); color: #00ff88; padding: 5px 14px; border-radius: 20px; font-size: 11px; font-weight: 600; }
        .pulse { animation: pulse 2s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
        .card { background: rgba(0,0,0,0.5); border-radius: 16px; padding: 18px; margin-bottom: 12px; border: 1px solid rgba(255,255,255,0.1); }
        .card-title { font-size: 16px; font-weight: 700; margin-bottom: 12px; color: #00ff88; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .stat-item { background: rgba(255,255,255,0.04); border-radius: 12px; padding: 14px; text-align: center; }
        .stat-value { font-size: 26px; font-weight: 800; color: #00ff88; }
        .stat-label { font-size: 10px; color: #aaa; text-transform: uppercase; }
        .signal-card { border: 1px solid rgba(0,255,136,0.3); }
        .signal-row { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 13px; }
        .btn { display: block; width: 100%; padding: 14px; border: none; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; text-align: center; margin: 8px 0; }
        .btn-green { background: linear-gradient(135deg,#00ff88,#00b4d8); color: #000; }
        .btn-gold { background: linear-gradient(135deg,#ffa502,#ff6348); color: #fff; }
        .btn-outline { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.2); }
        .forex-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .forex-item { background: rgba(255,255,255,0.04); border-radius: 10px; padding: 12px; cursor: pointer; }
        .forex-pair { font-weight: 700; font-size: 13px; }
        .forex-price { font-size: 16px; font-weight: 700; }
    </style>
</head>
<body>
<div class="overlay">
    <div class="header">
        <h1>🤖 Angel Trader Robot</h1>
        <p class="subtitle">TÉCNICA · RISCO · ANÁLISE · DISCIPLINA · ESTRATÉGIA · RESULTADO</p>
        <span class="status pulse">● EN LÍNEA</span>
    </div>
    <div class="card">
        <div class="card-title">📊 Forex - Tiempo Real</div>
        <div class="forex-grid" id="forex-prices">Cargando...</div>
    </div>
    <div class="card signal-card">
        <div class="card-title">🎯 Señal Quotex</div>
        <div class="signal-row"><span>📊 Par:</span><span><strong>EUR/USD</strong></span></div>
        <div class="signal-row"><span>⏰ Entrada:</span><span><strong id="hora-entrada">--:--</strong></span></div>
        <div class="signal-row"><span>🎯 Dirección:</span><span><strong id="direccion">--</strong></span></div>
        <div class="signal-row"><span>⏳ Vencimiento:</span><span><strong id="vencimiento">--:--</strong></span></div>
        <div class="signal-row"><span>📈 Gale 1:</span><span><strong id="gale1">--:--</strong></span></div>
        <div class="signal-row"><span>📈 Gale 2:</span><span><strong id="gale2">--:--</strong></span></div>
    </div>
    <button class="btn btn-green" onclick="generarSenal()">🔄 Nueva Señal</button>
    <button class="btn btn-gold" onclick="window.open('https://broker-qx.pro/sign-up/?lid=2097658','_blank')">💹 ABRIR QUOTEX</button>
    <button class="btn btn-outline" onclick="window.Telegram.WebApp.close()">📱 Cerrar</button>
</div>
<script>
    const tg = window.Telegram.WebApp; tg.expand(); tg.ready();
    function generarSenal(){
        const a=new Date(),m=Math.ceil(a.getMinutes()/5)*5,e=new Date(a);e.setMinutes(m,0,0);
        const v=new Date(e.getTime()+3e5),g1=new Date(v.getTime()+3e5),g2=new Date(g1.getTime()+3e5);
        const f=d=>d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
        document.getElementById('hora-entrada').textContent=f(e);
        document.getElementById('direccion').textContent=Math.random()>0.5?'CALL 🟩':'PUT 🟥';
        document.getElementById('vencimiento').textContent=f(v);
        document.getElementById('gale1').textContent=f(g1);
        document.getElementById('gale2').textContent=f(g2);
        tg.HapticFeedback.notification('success');
    }
    async function cargar(){
        try{
            const r=await fetch('https://api.exchangerate-api.com/v4/latest/USD'),d=await r.json();
            const p=[['EUR/USD','EUR'],['GBP/USD','GBP'],['USD/JPY','JPY'],['AUD/USD','AUD'],['USD/CAD','CAD'],['USD/CHF','CHF']];
            let h='';p.forEach(([p,q])=>{const pr=p.startsWith('USD')?d.rates[q]:d.rates[q]/d.rates[p.split('/')[0]];h+='<div class="forex-item" onclick="window.open(\'https://broker-qx.pro/sign-up/?lid=2097658\',\'_blank\')"><div class="forex-pair">'+p+'</div><div class="forex-price">'+pr.toFixed(5)+'</div></div>';});
            document.getElementById('forex-prices').innerHTML=h;
        }catch(e){}
    }
    generarSenal();cargar();
</script>
</body>
</html>
EOF
